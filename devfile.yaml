apiVersion: 1.0.0
metadata:
  generateName: web-nodejs-
projects:
  - name: nodejs-web-app
    source:
      type: git
      location: 'https://github.com/modernizing-java-applications-book/web-nodejs.git'
      branch: main
components:
  - type: chePlugin
    id: vscode/typescript-language-features/latest
  - type: chePlugin
    id: ms-vscode/node-debug2/latest
  - type: dockerimage
    alias: nodejs
    image: 'registry.access.redhat.com/ubi9/nodejs-18:latest'
    memoryLimit: 512Mi
    endpoints:
      - name: nodejs
        port: 8080
    mountSources: true
commands:
  - name: 1. Install dependencies
    actions:
      - type: exec
        component: nodejs
        command: npm install
        workdir: '${CHE_PROJECTS_ROOT}/nodejs-web-app'
  - name: 2. Run the web app (dev mode)
    actions:
      - type: exec
        component: nodejs
        command: npm run dev
        workdir: '${CHE_PROJECTS_ROOT}/nodejs-web-app'
  - name: 3. Build the web app
    actions:
      - type: exec
        component: nodejs
        command: npm run build
        workdir: '${CHE_PROJECTS_ROOT}/nodejs-web-app'
  - name: 4. Run the web app (production)
    actions:
      - type: exec
        component: nodejs
        command: npm start
        workdir: '${CHE_PROJECTS_ROOT}/nodejs-web-app'
  - name: 5. Stop the web app
    actions:
      - type: exec
        component: nodejs
        command: 'node_server_pids=$(pgrep -f "next" | tr "\\n" " ") && echo "Stopping Next.js with PIDs: ${node_server_pids}" && kill -15 ${node_server_pids} &>/dev/null && echo ''Done.'''
